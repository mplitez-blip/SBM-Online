services:
  database:
    image: postgres:17-bookworm
    container_name: sbm-postgres
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - sbm_postgres_data:/var/lib/postgresql/data
    networks:
      - sbm_internal
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sbm-migrate
    env_file:
      - .env.docker
    environment:
      NODE_ENV: production
      SQL_HOST: database
      SQL_PORT: 5432
      SQL_USER: ${POSTGRES_USER}
      SQL_PASSWORD: ${POSTGRES_PASSWORD}
      SQL_DB_NAME: ${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
    command:
      - npm
      - run
      - db:migrate
    depends_on:
      database:
        condition: service_healthy
    networks:
      - sbm_internal
    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sbm-app
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      SQL_HOST: database
      SQL_PORT: 5432
      SQL_USER: ${POSTGRES_USER}
      SQL_PASSWORD: ${POSTGRES_PASSWORD}
      SQL_DB_NAME: ${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      FIREBASE_AUTH_ENABLED: "false"
      ALLOW_DEVELOPMENT_SEED: "false"
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      database:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - sbm_internal
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

networks:
  sbm_internal:
    driver: bridge

volumes:
  sbm_postgres_data:
    name: sbm_postgres_data
